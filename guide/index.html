<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宣導動畫工作室 使用教學</title>
<style>
:root{--bg:#EEF2EF;--ink:#1B2621;--muted:#5C6A63;--green:#1F7A5A;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
header{background:var(--green);color:#fff;padding:20px max(16px,4vw)}
header h1{margin:0;font-size:clamp(22px,4vw,32px)}
header p{margin:4px 0 0;opacity:.9}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.bar a{background:#fff;color:var(--green);text-decoration:none;font-weight:700;padding:8px 16px;border-radius:99px}
.bar a.alt{background:transparent;color:#fff;border:2px solid #fff}
main{max-width:1200px;margin:0 auto;padding:20px max(16px,4vw) 48px;display:grid;gap:22px}
figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(20,40,30,.1)}
figure img{display:block;width:100%;height:auto}
footer{text-align:center;color:var(--muted);padding:0 16px 32px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>楠小宣導動畫工作室・使用教學</h1>
  <p>7 個步驟，做出一分鐘的宣導動畫並下載成影片。</p>
  <div class="bar"><a href="../">開始使用工作室</a><a class="alt" href="宣導動畫工作室_使用教學.pdf" download>下載 PDF 版</a><a class="alt" href="宣導動畫工作室_使用教學_黑白列印版.pdf" download>黑白列印版</a></div>
</header>
<main>
  <figure><img src="00_封面.jpg" alt="封面：楠小宣導動畫工作室使用教學"></figure>
  <figure><img src="01_打開網站.jpg" alt="步驟1 打開網站，認識畫面"></figure>
  <figure><img src="02_選範本與風格.jpg" alt="步驟2 選範本、選風格"></figure>
  <figure><img src="03_修改文字.jpg" alt="步驟3 修改每一幕的文字"></figure>
  <figure><img src="04_錄自己的配音.jpg" alt="步驟4 錄自己的配音"></figure>
  <figure><img src="05_動畫與背景.jpg" alt="步驟5 調整動畫與背景"></figure>
  <figure><img src="06_下載影片.jpg" alt="步驟6 下載成影片"></figure>
  <figure><img src="07_分享與常見問題.jpg" alt="步驟7 分享作品與常見問題"></figure>
</main>
<footer>高雄市楠梓國小 教研組</footer>
</body>
</html>
